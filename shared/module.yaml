product:
  type: kmp/lib
  platforms: [ wasmJs ]

settings:
  compose:
    enabled: true
    resources:
      packageName: dev.tomaswild.portfolio.resources
      exposedAccessors: true

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.material3.adaptive
