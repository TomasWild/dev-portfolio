<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="preload"
          href="./composeResources/dev.tomaswild.portfolio.resources/font/NotoSansSC_VariableFont_wght.ttf" as="fetch"
          type="font/ttf" crossorigin/>
    <script>
        var currentLanguagesImplementation =
            Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        var newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                } else {
                    return currentLanguagesImplementation.get.apply(this);
                }
            }
        });
        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation)
    </script>
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="presentation">
    <circle cx="36" cy="36" r="32" stroke="var(--track)" stroke-width="3" fill="none"/>
    <circle cx="36" cy="36" r="32" stroke="var(--accent)" stroke-width="3" fill="none"
            stroke-linecap="round" stroke-dasharray="50 152">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 36 36" to="360 36 36" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="43" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="22" font-weight="600" fill="var(--fg)">
        TW
        <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
    </text>
</svg>
{{kotlin.scripts}}
</body>
</html>
